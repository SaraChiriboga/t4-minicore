<div class="login-container" [class.mobile]="responsiveService.isMobile()">
    <form (ngSubmit)="onSubmit()">
        <h1>Iniciar sesión</h1>
        <div>
            <label for="email">Correo Electrónico:</label>
            <input [(ngModel)]="email" placeholder="Correo Electrónico" name="email" id="email" />
        </div>
        <div>
            <label for="password">Contraseña:</label>
            <input [(ngModel)]="password" placeholder="Contraseña" name="password" id="password" type="password" />
        </div>
        <button type="submit">Iniciar sesión</button>
    </form>
    
    @if (errorMessage()) {
        <p class="error-message">{{ errorMessage() }}</p>
    }
</div>
