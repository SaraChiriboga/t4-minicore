services:
  # Backend API en Crystal / Lucky Framework
  - type: web
    name: t4-minicore-api
    runtime: docker
    rootDir: t4-minicore-api
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: LUCKY_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: t4-minicore-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true

  # Frontend SPA en Angular
  - type: static_site
    name: t4-minicore-web
    rootDir: t4-minicore-web
    buildCommand: npm install && npm run build
    publishPath: dist/t4-minicore-web/browser
    routes:
      # Regla para Single Page Application (SPA routing)
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Base de datos PostgreSQL administrada
  - name: t4-minicore-db
    databaseName: t4_minicore_api_production
    user: lucky
    plan: free
